name: Update Gridiron Index

on:
  schedule:
    # Saturday and Sunday mornings, 11:23 UTC (7:23 AM EDT / 6:23 AM EST)
    - cron: "23 11 * * 0,6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gridiron-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Pull ESPN data and rebuild
        run: node build/build.js
      - name: Commit updated page
        run: |
          git config user.name "gridiron-index-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html artifact.html data/latest.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update rankings $(date -u +%Y-%m-%d)"
            git push
          fi
